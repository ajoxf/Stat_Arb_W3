<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e1e1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Mark: Connected nodes (nexus) -->
  <g transform="translate(8, 10)">
    <!-- Center node -->
    <circle cx="15" cy="15" r="5" fill="#3b82f6"/>
    <!-- Connecting lines -->
    <line x1="15" y1="15" x2="5" y2="5" stroke="#3b82f6" stroke-width="2"/>
    <line x1="15" y1="15" x2="25" y2="5" stroke="#3b82f6" stroke-width="2"/>
    <line x1="15" y1="15" x2="5" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <line x1="15" y1="15" x2="25" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <!-- Outer nodes -->
    <circle cx="5" cy="5" r="3" fill="#60a5fa"/>
    <circle cx="25" cy="5" r="3" fill="#60a5fa"/>
    <circle cx="5" cy="25" r="3" fill="#60a5fa"/>
    <circle cx="25" cy="25" r="3" fill="#60a5fa"/>
  </g>

  <!-- Text: NEXUS -->
  <text x="48" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="url(#grad3)">NEXUS</text>
</svg>