<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Mark: Two converging lines forming an M -->
  <g transform="translate(5, 8)">
    <!-- Left line -->
    <line x1="0" y1="32" x2="16" y2="2" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
    <!-- Right line -->
    <line x1="32" y1="32" x2="16" y2="2" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot (convergence point) -->
    <circle cx="16" cy="2" r="3" fill="#c9a227"/>
  </g>

  <!-- Text: MERIDIAN -->
  <text x="50" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="url(#grad1)">MERIDIAN</text>
</svg>