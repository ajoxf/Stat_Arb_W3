<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Nexus favicon: connected nodes -->
  <rect width="32" height="32" rx="4" fill="#1e1e1e"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="5" fill="#3b82f6"/>
  <!-- Connecting lines -->
  <line x1="16" y1="16" x2="6" y2="6" stroke="#3b82f6" stroke-width="2"/>
  <line x1="16" y1="16" x2="26" y2="6" stroke="#3b82f6" stroke-width="2"/>
  <line x1="16" y1="16" x2="6" y2="26" stroke="#3b82f6" stroke-width="2"/>
  <line x1="16" y1="16" x2="26" y2="26" stroke="#3b82f6" stroke-width="2"/>
  <!-- Outer nodes -->
  <circle cx="6" cy="6" r="3" fill="#60a5fa"/>
  <circle cx="26" cy="6" r="3" fill="#60a5fa"/>
  <circle cx="6" cy="26" r="3" fill="#60a5fa"/>
  <circle cx="26" cy="26" r="3" fill="#60a5fa"/>
</svg>