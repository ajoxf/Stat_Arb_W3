<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crypto Stat Arb{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e9ecef;
            --border-color: #dee2e6;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent-green: #198754;
            --accent-red: #dc3545;
            --accent-blue: #0d6efd;
            --accent-yellow: #ffc107;
            --accent-purple: #6f42c1;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--bg-secondary) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--text-primary) !important;
        }

        .nav-link {
            color: var(--text-secondary) !important;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary) !important;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .card-header {
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-body {
            color: var(--text-primary);
        }

        .form-control, .form-select {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-primary);
            border-color: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        .btn-primary {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #157347;
            border-color: #146c43;
        }

        .btn-danger {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }

        .btn-outline-secondary {
            color: var(--text-secondary);
            border-color: var(--border-color);
        }

        .btn-outline-secondary:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .table {
            color: var(--text-primary);
        }

        .table-dark {
            --bs-table-bg: var(--bg-secondary);
            --bs-table-color: var(--text-primary);
            --bs-table-border-color: var(--border-color);
        }

        .table-dark th, .table-dark td {
            color: var(--text-primary);
        }

        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .badge-long {
            background-color: var(--accent-green) !important;
            color: #fff !important;
        }

        .badge-short {
            background-color: var(--accent-red) !important;
            color: #fff !important;
        }

        .price-up {
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .price-down {
            color: var(--accent-red) !important;
            font-weight: 600;
        }

        .status-connected {
            color: var(--accent-green);
        }

        .status-disconnected {
            color: var(--text-secondary);
        }

        .status-error {
            color: var(--accent-red);
        }

        .metric-card {
            text-align: center;
            padding: 1rem;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', monospace;
            color: var(--text-primary);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .zscore-positive {
            color: var(--accent-green) !important;
            font-weight: 700;
        }

        .zscore-negative {
            color: var(--accent-red) !important;
            font-weight: 700;
        }

        .zscore-neutral {
            color: var(--text-secondary);
        }

        .algo-switch {
            transform: scale(1.5);
        }

        .flash {
            animation: flash 0.3s ease-in-out;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Text colors */
        .text-secondary {
            color: var(--text-secondary) !important;
        }

        /* Badge overrides for light theme */
        .bg-secondary {
            background-color: #6c757d !important;
        }

        .bg-success {
            background-color: var(--accent-green) !important;
        }

        .bg-danger {
            background-color: var(--accent-red) !important;
        }

        .bg-warning {
            background-color: var(--accent-yellow) !important;
            color: #000 !important;
        }

        .bg-primary {
            background-color: var(--accent-blue) !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow me-2"></i>Crypto Stat Arb
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear me-1"></i>Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'setup' %}active{% endif %}" href="/setup">
                            <i class="bi bi-plug me-1"></i>Exchanges
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'analysis' %}active{% endif %}" href="/analysis">
                            <i class="bi bi-bar-chart me-1"></i>Analysis
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="me-3 text-secondary" id="connection-status">
                        <i class="bi bi-circle-fill me-1 status-disconnected"></i>Connecting...
                    </span>
                    <div class="form-check form-switch">
                        <input class="form-check-input algo-switch" type="checkbox" id="algoSwitch">
                        <label class="form-check-label text-secondary" for="algoSwitch">Algo</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>

    <script>
        // Initialize Socket.IO connection
        const socket = io();

        socket.on('connect', function() {
            console.log('Connected to server');
            updateConnectionStatus('connected');
            socket.emit('get_status');
        });

        socket.on('disconnect', function() {
            console.log('Disconnected from server');
            updateConnectionStatus('disconnected');
        });

        socket.on('status', function(data) {
            console.log('Status:', data);
            document.getElementById('algoSwitch').checked = data.algo_enabled;
            updateConnectionStatus(data.is_running ? 'connected' : 'disconnected');
        });

        socket.on('error', function(data) {
            console.error('Error:', data.message);
            showToast('Error: ' + data.message, 'danger');
        });

        // Algo toggle
        document.getElementById('algoSwitch').addEventListener('change', function() {
            const enabled = this.checked;
            fetch('/api/engine/toggle-algo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({enabled: enabled})
            })
            .then(response => response.json())
            .then(data => {
                showToast(enabled ? 'Algo trading enabled' : 'Algo trading disabled', 'success');
            })
            .catch(error => {
                console.error('Error:', error);
                this.checked = !enabled;
            });
        });

        function updateConnectionStatus(status) {
            const el = document.getElementById('connection-status');
            if (status === 'connected') {
                el.innerHTML = '<i class="bi bi-circle-fill me-1 status-connected"></i>Connected';
            } else {
                el.innerHTML = '<i class="bi bi-circle-fill me-1 status-disconnected"></i>Disconnected';
            }
        }

        function showToast(message, type = 'info') {
            // Simple toast notification
            const toast = document.createElement('div');
            toast.className = `alert alert-${type} position-fixed bottom-0 end-0 m-3`;
            toast.style.zIndex = 9999;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function formatPrice(price, decimals = 2) {
            if (price === null || price === undefined) return '-';
            return parseFloat(price).toFixed(decimals);
        }

        function formatPercent(value) {
            if (value === null || value === undefined) return '-';
            const prefix = value >= 0 ? '+' : '';
            return prefix + parseFloat(value).toFixed(2) + '%';
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
