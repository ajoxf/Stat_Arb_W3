<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Nexus</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; width: 100%; margin: auto; }
        .brand-logo { height: 40px; }
        .form-control:focus { border-color: #198754; box-shadow: 0 0 0 3px rgba(25,135,84,.2); }
        .btn-primary { background-color: #198754; border-color: #198754; }
        .btn-primary:hover { background-color: #157347; border-color: #146c43; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="/static/logo-nexus.svg" alt="Nexus" class="brand-logo mb-3">
            <h4 class="fw-bold">Sign in to Nexus</h4>
            <p class="text-muted small">Your crypto statistical arbitrage platform</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div id="alert-box" class="alert d-none" role="alert"></div>

                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email or Username</label>
                        <input type="text" class="form-control" id="email" name="email"
                               placeholder="you@example.com" autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" autocomplete="current-password" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggle-pw" tabindex="-1">
                                <i class="bi bi-eye" id="pw-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-muted" for="remember">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-login">
                        <span id="btn-text">Sign In</span>
                        <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted mt-3 small">
            Don't have an account?
            <a href="/auth/register" class="text-decoration-none fw-semibold">Create one</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Password visibility toggle
    document.getElementById('toggle-pw').addEventListener('click', function() {
        const pw = document.getElementById('password');
        const icon = document.getElementById('pw-icon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            pw.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });

    // Form submit
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const spinner = document.getElementById('btn-spinner');
        const btnText = document.getElementById('btn-text');
        const alertBox = document.getElementById('alert-box');

        btn.disabled = true;
        spinner.classList.remove('d-none');
        btnText.textContent = 'Signing in...';
        alertBox.className = 'alert d-none';

        try {
            const resp = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    remember: document.getElementById('remember').checked,
                })
            });
            const data = await resp.json();

            if (data.success) {
                window.location.href = data.redirect || '/dashboard';
            } else {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = data.error || 'Login failed';
                btn.disabled = false;
                spinner.classList.add('d-none');
                btnText.textContent = 'Sign In';
            }
        } catch (err) {
            alertBox.className = 'alert alert-danger';
            alertBox.textContent = 'Network error. Please try again.';
            btn.disabled = false;
            spinner.classList.add('d-none');
            btnText.textContent = 'Sign In';
        }
    });

    // Allow Enter key in email field
    document.getElementById('email').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
</script>
</body>
</html>
